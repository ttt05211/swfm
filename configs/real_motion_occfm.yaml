UPSTREAM:
  REPO: Orbis36/OccFM-NeurIPS2025
  COMMIT: 64959840a9a4cb54d5b0f6cd4bc6779bb242a853
  LATENT_HW: [50, 50]
  LATENT_CHANNELS: 16
  OCC_RANGE: [-40, -40, -1, 40, 40, 5.4]
  VOXEL_SIZE: [0.4, 0.4, 0.4]
MODEL:
  WINDOW_HW: [20, 20]
  MAX_WINDOWS: 8
  MIN_WINDOW_COVERAGE: 0.95
  PRIOR_CHANNELS: 32
  SAMPLE_STEPS: 10
  RESCALE_FACTOR: 10.0
  ALPHA_SHIFT: 3.0
  USE_CFG: false
MOTION:
  STATES: [confident_static, moving, uncertain, free]
  STATIC_MIN_PERSISTENCE: 0.80
  MOVING_MAX_PERSISTENCE: 0.50
  USE_COMPONENT_TRACKS: true
  COMPONENT_HISTORY_DT_S: 0.5
  COMPONENT_MAX_STEP_M: 4.0
  COMPONENT_MOVING_SPEED_MPS: 0.5
  COMPONENT_STATIC_SPEED_MPS: 0.2
  COMPONENT_MIN_TRACK_FRAMES: 2
  KTA_HISTORY_DT_S: 0.5
  KTA_MAX_MATCH_DISTANCE_M: 6.0
  KTA_TUBE_RADII: [1, 2, 3, 4, 5, 6]
  LATENT_EXTRA_RADIUS: 1
CACHE:
  VERSION: real_motion_v3
  SHARDED: true
  PREPARED_SHARD_SIZE: 16
  LATENT_SHARD_SIZE: 128
  VAE_LATENT_MODE: sample
  VAE_BATCH_SIZE: 4
  PRECOMPUTE_WINDOW_PLAN: true
  FILTER_EMPTY_GENERATION_SUPPORT: true
TARGET:
  WM_TARGET: dynamic_semantics_inside_causal_generation_support
  METRIC_TARGET: interval_displacement_v2_gt_instance_support
  FREE_LABEL: 17
METRIC:
  PROTOCOL: interval_displacement_v2
  SPEED_THRESHOLD_MPS: 0.5
  BOX_MARGIN_M: 0.5
  REPORT_HORIZONS_S: [1.0, 2.0, 3.0]
  DYNAMIC_CLASS_IDS: [2, 3, 4, 5, 6, 7, 9, 10]
  AGGREGATION: per_horizon_miou_then_mean
ANALYSIS:
  SPEED_CHANGE_THRESHOLD_MPS: 1.0
  TURN_RATE_THRESHOLD_DEG_S: 10.0
RUNTIME:
  GPU_PROFILE: L40S
  AMP:
    ENABLED: true
    DTYPE: bfloat16
  VAE_AMP:
    ENABLED: false
    DTYPE: bfloat16
  TF32: true
  MATMUL_PRECISION: high
  CUDNN_BENCHMARK: true
  FLASH_SDP: true
  FUSED_ADAMW: true
  COMPILE:
    TRAIN: false
    INFERENCE: false
    MODE: reduce-overhead
    DYNAMIC: true
  DATALOADER:
    PIN_MEMORY: true
    PERSISTENT_WORKERS: true
    PREFETCH_FACTOR: 4
  DDP:
    BUCKET_CAP_MB: 50
    GRADIENT_AS_BUCKET_VIEW: true
    STATIC_GRAPH: true
  L40S_BATCH_CANDIDATES: [4, 6, 8, 10, 12, 16, 20, 24]
  L40S_WORKER_CANDIDATES: [0, 2, 4, 8]
  L40S_MEMORY_HEADROOM_GB: 3.0
OPTIMIZATION:
  TINY:
    BATCH_SIZE: 2
    STEPS: 2000
    BASE_LR: 2.0e-05
    WEIGHT_DECAY: 0.01
    GRAD_NORM_CLIP: 5.0
  FULL:
    BATCH_SIZE_PER_GPU: 4
    NUM_EPOCHS: 200
    BASE_LR: 2.0e-05
    WARMUP_STEPS: 1000
    MIN_LR_RATIO: 0.2
    GRAD_NORM_CLIP: 5.0
    WEIGHT_DECAY: 0.01
    EMA_DECAY: 0.9999
    SAVE_EVERY_EPOCHS: 5
    NUM_WORKERS: 2
